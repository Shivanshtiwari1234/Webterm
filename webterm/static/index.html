<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webterm</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: "JetBrains Mono", "Fira Code", monospace;
            background: #101114;
            color: #e6e6e6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 680px);
        }

        .label {
            color: #8b9bff;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0;
            font-size: clamp(36px, 9vw, 64px);
            letter-spacing: -0.07em;
        }

        h1 span {
            color: #8b9bff;
        }

        p {
            color: #a5a7b0;
            line-height: 1.7;
        }

        form {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 14px;
            border: 1px solid #343641;
            border-radius: 8px;
            background: #191a20;
            color: #fff;
            font: inherit;
        }

        button {
            padding: 14px 18px;
            border: 0;
            border-radius: 8px;
            background: #8b9bff;
            color: #101114;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a8b3ff;
        }

        .tips {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #292a32;
            font-size: 12px;
        }

        kbd {
            padding: 3px 6px;
            border: 1px solid #424450;
            border-radius: 4px;
            color: #d9dcff;
        }

        @media (max-width: 480px) {
            form {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="label">Terminal-native browsing</div>

        <h1>Web<span>term</span></h1>

        <p>
            Your web, in the terminal.
            Lightweight browsing with a keyboard-first interface.
        </p>

        <form action="https://html.duckduckgo.com/html/" method="get">
            <input type="search" name="q" placeholder="Search the web or enter a query..." aria-label="Search the web"
                autofocus required>
            <button type="submit">Search</button>
        </form>

        <div class="tips">
            <p><kbd>Ctrl+L</kbd> Focus address bar</p>
            <p><kbd>Ctrl+T</kbd> New tab</p>
            <p><kbd>Ctrl+W</kbd> Close tab</p>
            <p><kbd>Alt+Left</kbd> Go back</p>
        </div>
    </main>
</body>

</html>
